name: Splatoon3 Bot (reusable)

on:
  workflow_call:
    inputs:
      profile:
        description: Run Profile to execute
        required: true
        type: string
      notification_channels:
        description: Optional comma-separated Notification Channels
        required: false
        default: ''
        type: string
    secrets:
      UPYUN_BUCKET:
        required: true
      UPYUN_OPERATOR:
        required: true
      UPYUN_SECRET:
        required: true
      BOT_WECOM_CONFIG:
        required: false
      BOT_DISCORD_CONFIG:
        required: false
      BOT_TELEGRAM_CONFIG:
        required: false
      BOT_QQ_CONFIG:
        required: false
      BOT_FEISHU_CONFIG:
        required: false
      BOT_DINGTALK_CONFIG:
        required: false

permissions:
  contents: read

concurrency:
  group: splatoon3-bot-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
      notification_channels: ${{ steps.plan.outputs.notification_channels }}
      profile: ${{ steps.plan.outputs.profile }}
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Chrome for Testing cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Resolve Run Plan
        id: plan
        env:
          PROFILE: ${{ inputs.profile }}
          CHANNELS: ${{ inputs.notification_channels || vars.BOT_NOTIFICATION_CHANNELS || 'wecom' }}
        run: node bot/run/describe.mjs "$PROFILE" "$CHANNELS"

      - name: Prepare Data Snapshot and screenshot artifacts
        env:
          PROFILE: ${{ steps.plan.outputs.profile }}
        run: node bot/run/prepare.mjs "$PROFILE"

      - name: Archive Bot Run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ steps.plan.outputs.artifact_name }}-${{ github.run_id }}
          path: |
            screenshots/*.png
            screenshots/run-manifest.json
            data/**/*.json
            data/.snapshot.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish screenshot artifacts
    needs: prepare
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod --strict-peer-dependencies

      - name: Download Bot Run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots-${{ needs.prepare.outputs.artifact_name }}-${{ github.run_id }}
          path: .

      - name: Install Upyun CLI
        env:
          UPX_VERSION: 0.4.9
          UPX_SHA256: 830ee3d487fd0d3dd351e0d0d113f036871499e4469ce443f3f1758c7153e878
        run: |
          archive="$RUNNER_TEMP/upx.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/upyun/upx/releases/download/v${UPX_VERSION}/upx_${UPX_VERSION}_linux_amd64.tar.gz"
          echo "${UPX_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          chmod 0755 "$RUNNER_TEMP/upx"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Publish to Upyun
        env:
          PROFILE: ${{ needs.prepare.outputs.profile }}
          UPX_SERVICENAME: ${{ secrets.UPYUN_BUCKET }}
          UPX_OPERATOR: ${{ secrets.UPYUN_OPERATOR }}
          UPX_PASSWORD: ${{ secrets.UPYUN_SECRET }}
        run: node bot/publish/index.mjs "$PROFILE"

  notify-wecom:
    name: Notify WeCom
    if: ${{ contains(fromJSON(needs.prepare.outputs.notification_channels), 'wecom') }}
    needs:
      - prepare
      - publish
    uses: ./.github/workflows/bot-notify.yml
    with:
      profile: ${{ needs.prepare.outputs.profile }}
      channel: wecom
      artifact_name: ${{ needs.prepare.outputs.artifact_name }}
    secrets:
      BOT_CHANNEL_CONFIG: ${{ secrets.BOT_WECOM_CONFIG }}

  notify-discord:
    name: Notify Discord
    if: ${{ contains(fromJSON(needs.prepare.outputs.notification_channels), 'discord') }}
    needs:
      - prepare
      - publish
    uses: ./.github/workflows/bot-notify.yml
    with:
      profile: ${{ needs.prepare.outputs.profile }}
      channel: discord
      artifact_name: ${{ needs.prepare.outputs.artifact_name }}
    secrets:
      BOT_CHANNEL_CONFIG: ${{ secrets.BOT_DISCORD_CONFIG }}

  notify-telegram:
    name: Notify Telegram
    if: ${{ contains(fromJSON(needs.prepare.outputs.notification_channels), 'telegram') }}
    needs:
      - prepare
      - publish
    uses: ./.github/workflows/bot-notify.yml
    with:
      profile: ${{ needs.prepare.outputs.profile }}
      channel: telegram
      artifact_name: ${{ needs.prepare.outputs.artifact_name }}
    secrets:
      BOT_CHANNEL_CONFIG: ${{ secrets.BOT_TELEGRAM_CONFIG }}

  notify-qq:
    name: Notify QQ
    if: ${{ contains(fromJSON(needs.prepare.outputs.notification_channels), 'qq') }}
    needs:
      - prepare
      - publish
    uses: ./.github/workflows/bot-notify.yml
    with:
      profile: ${{ needs.prepare.outputs.profile }}
      channel: qq
      artifact_name: ${{ needs.prepare.outputs.artifact_name }}
    secrets:
      BOT_CHANNEL_CONFIG: ${{ secrets.BOT_QQ_CONFIG }}

  notify-feishu:
    name: Notify Feishu
    if: ${{ contains(fromJSON(needs.prepare.outputs.notification_channels), 'feishu') }}
    needs:
      - prepare
      - publish
    uses: ./.github/workflows/bot-notify.yml
    with:
      profile: ${{ needs.prepare.outputs.profile }}
      channel: feishu
      artifact_name: ${{ needs.prepare.outputs.artifact_name }}
    secrets:
      BOT_CHANNEL_CONFIG: ${{ secrets.BOT_FEISHU_CONFIG }}

  notify-dingtalk:
    name: Notify DingTalk
    if: ${{ contains(fromJSON(needs.prepare.outputs.notification_channels), 'dingtalk') }}
    needs:
      - prepare
      - publish
    uses: ./.github/workflows/bot-notify.yml
    with:
      profile: ${{ needs.prepare.outputs.profile }}
      channel: dingtalk
      artifact_name: ${{ needs.prepare.outputs.artifact_name }}
    secrets:
      BOT_CHANNEL_CONFIG: ${{ secrets.BOT_DINGTALK_CONFIG }}

  notification-summary:
    name: Notification summary
    if: ${{ always() }}
    needs:
      - prepare
      - publish
      - notify-wecom
      - notify-discord
      - notify-telegram
      - notify-qq
      - notify-feishu
      - notify-dingtalk
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Summarize Bot Run
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          NOTIFICATION_CHANNELS: ${{ needs.prepare.outputs.notification_channels }}
          WECOM_RESULT: ${{ needs.notify-wecom.result }}
          DISCORD_RESULT: ${{ needs.notify-discord.result }}
          TELEGRAM_RESULT: ${{ needs.notify-telegram.result }}
          QQ_RESULT: ${{ needs.notify-qq.result }}
          FEISHU_RESULT: ${{ needs.notify-feishu.result }}
          DINGTALK_RESULT: ${{ needs.notify-dingtalk.result }}
        run: |
          failed=0
          summarize_channel() {
            channel="$1"
            result="$2"
            if [[ "$NOTIFICATION_CHANNELS" == *"\"${channel}\""* ]]; then
              echo "- notify ${channel}: ${result}"
              if [ "$result" != success ]; then
                failed=1
              fi
            fi
          }

          {
            echo '## Splatoon3 Bot Run'
            echo "- prepare: ${PREPARE_RESULT}"
            echo "- publish: ${PUBLISH_RESULT}"
            summarize_channel wecom "$WECOM_RESULT"
            summarize_channel discord "$DISCORD_RESULT"
            summarize_channel telegram "$TELEGRAM_RESULT"
            summarize_channel qq "$QQ_RESULT"
            summarize_channel feishu "$FEISHU_RESULT"
            summarize_channel dingtalk "$DINGTALK_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$PREPARE_RESULT" != success ] || [ "$PUBLISH_RESULT" != success ]; then
            failed=1
          fi
          exit "$failed"
