name: Splatoon3 Bot (reusable)

on:
  workflow_call:
    inputs:
      profile:
        description: Run Profile to execute
        required: true
        type: string
      notification_channels:
        description: Optional comma-separated Notification Channels
        required: false
        default: ''
        type: string
    secrets:
      UPYUN_BUCKET:
        required: true
      UPYUN_OPERATOR:
        required: true
      UPYUN_SECRET:
        required: true
      BOT_WECOM_CONFIG:
        required: false
      BOT_DISCORD_CONFIG:
        required: false
      BOT_TELEGRAM_CONFIG:
        required: false
      BOT_QQ_CONFIG:
        required: false
      BOT_FEISHU_CONFIG:
        required: false
      BOT_DINGTALK_CONFIG:
        required: false

permissions:
  contents: read

concurrency:
  group: splatoon3-bot-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
      notification_matrix: ${{ steps.plan.outputs.notification_matrix }}
      profile: ${{ steps.plan.outputs.profile }}
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Chrome for Testing cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Resolve Run Plan
        id: plan
        env:
          PROFILE: ${{ inputs.profile }}
          CHANNELS: ${{ inputs.notification_channels || vars.BOT_NOTIFICATION_CHANNELS || 'wecom' }}
        run: node bot/run/describe.mjs "$PROFILE" "$CHANNELS"

      - name: Prepare Data Snapshot and screenshot artifacts
        env:
          PROFILE: ${{ steps.plan.outputs.profile }}
        run: node bot/run/prepare.mjs "$PROFILE"

      - name: Archive Bot Run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ steps.plan.outputs.artifact_name }}-${{ github.run_id }}
          path: |
            screenshots/*.png
            screenshots/run-manifest.json
            data/**/*.json
            data/.snapshot.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish screenshot artifacts
    needs: prepare
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod --strict-peer-dependencies

      - name: Download Bot Run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots-${{ needs.prepare.outputs.artifact_name }}-${{ github.run_id }}
          path: .

      - name: Install Upyun CLI
        env:
          UPX_VERSION: 0.4.9
          UPX_SHA256: 830ee3d487fd0d3dd351e0d0d113f036871499e4469ce443f3f1758c7153e878
        run: |
          archive="$RUNNER_TEMP/upx.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/upyun/upx/releases/download/v${UPX_VERSION}/upx_${UPX_VERSION}_linux_amd64.tar.gz"
          echo "${UPX_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          chmod 0755 "$RUNNER_TEMP/upx"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Publish to Upyun
        env:
          PROFILE: ${{ needs.prepare.outputs.profile }}
          UPX_SERVICENAME: ${{ secrets.UPYUN_BUCKET }}
          UPX_OPERATOR: ${{ secrets.UPYUN_OPERATOR }}
          UPX_PASSWORD: ${{ secrets.UPYUN_SECRET }}
        run: node bot/publish/index.mjs "$PROFILE"

  notify:
    name: Notify ${{ matrix.channel }}
    needs:
      - prepare
      - publish
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.notification_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod --strict-peer-dependencies

      - name: Download Bot Run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots-${{ needs.prepare.outputs.artifact_name }}-${{ github.run_id }}
          path: .

      - name: Deliver notifications
        env:
          PROFILE: ${{ needs.prepare.outputs.profile }}
          CHANNEL: ${{ matrix.channel }}
          BOT_CHANNEL_CONFIG: ${{ secrets[matrix.secret] }}
          UPYUN_DOMAIN: ${{ vars.UPYUN_DOMAIN }}
        run: node bot/notification/index.mjs "$PROFILE" "$CHANNEL"

  notification-summary:
    name: Notification summary
    if: ${{ always() }}
    needs:
      - prepare
      - publish
      - notify
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Summarize Bot Run
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          NOTIFY_RESULT: ${{ needs.notify.result }}
        run: |
          {
            echo '## Splatoon3 Bot Run'
            echo "- prepare: ${PREPARE_RESULT}"
            echo "- publish: ${PUBLISH_RESULT}"
            echo "- notify: ${NOTIFY_RESULT}"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$PREPARE_RESULT" = success
          test "$PUBLISH_RESULT" = success
          test "$NOTIFY_RESULT" = success
