name: Splatoon3 Bot (reusable)

on:
  workflow_call:
    inputs:
      schedules:
        description: 'Battle overview (Regular, Anarchy, X Battle, or active Splatfest)'
        required: false
        default: false
        type: boolean
      schedules_regular:
        description: 'Single Regular Battle card'
        required: false
        default: false
        type: boolean
      schedules_anarchy:
        description: 'Anarchy Series and Open cards'
        required: false
        default: false
        type: boolean
      schedules_x:
        description: 'Single X Battle card'
        required: false
        default: false
        type: boolean
      challenges:
        description: 'Challenges'
        required: false
        default: false
        type: boolean
      salmon_run:
        description: 'Salmon Run'
        required: false
        default: false
        type: boolean
      gear_dailydrop:
        description: 'Daily Drop gear'
        required: false
        default: false
        type: boolean
      gear_regular:
        description: 'Gear currently on sale'
        required: false
        default: false
        type: boolean
      gear_salmon_run:
        description: 'Monthly Salmon Run gear'
        required: false
        default: false
        type: boolean
      splatfest_na:
        description: 'North America Splatfest (time-dependent)'
        required: false
        default: false
        type: boolean
      splatfest_eu:
        description: 'Europe Splatfest (time-dependent)'
        required: false
        default: false
        type: boolean
      splatfest_jp:
        description: 'Japan Splatfest (time-dependent)'
        required: false
        default: false
        type: boolean
      splatfest_ap:
        description: 'Asia-Pacific Splatfest (time-dependent)'
        required: false
        default: false
        type: boolean
      notification_channel:
        description: Optional single Notification Channel for smoke testing
        required: false
        default: ''
        type: string
    secrets:
      S3_CONFIG:
        required: true
      BOT_WECOM_CONFIG:
        required: false
      BOT_DISCORD_CONFIG:
        required: false
      BOT_TELEGRAM_CONFIG:
        required: false
      BOT_QQ_CONFIG:
        required: false
      BOT_FEISHU_CONFIG:
        required: false
      BOT_DINGTALK_CONFIG:
        required: false
      BOT_WHATSAPP_CONFIG:
        required: false
      BOT_LINE_CONFIG:
        required: false
      BOT_SLACK_CONFIG:
        required: false

permissions:
  contents: read

concurrency:
  group: splatoon3-bot-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare selected content
    runs-on: ${{ vars.BOT_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.prepare.outputs.artifact_name }}
      selection: ${{ steps.prepare.outputs.selection }}
      has_content: ${{ steps.prepare.outputs.has_content }}
      snapshot_acquisition: ${{ steps.prepare.outputs.snapshot_acquisition }}
    env:
      BOT_TIME_ZONE: ${{ vars.BOT_TIME_ZONE || 'Asia/Shanghai' }}
      BOT_LOCALE: ${{ vars.BOT_LOCALE || 'zh-CN' }}
      BOT_SCREENSHOT_RESOLUTION: ${{ vars.BOT_SCREENSHOT_RESOLUTION || '1200x675' }}
      BOT_SCREENSHOT_ATTRIBUTION: ${{ vars.BOT_SCREENSHOT_ATTRIBUTION || 'splatoon3.ink' }}
      TZ: ${{ vars.BOT_TIME_ZONE || 'Asia/Shanghai' }}
    steps:
      - name: Initialize Bot Run Report
        env:
          BOT_RUN_INPUTS: ${{ toJSON(inputs) }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto'
          import fs from 'node:fs/promises'
          import path from 'node:path'

          const inputs = JSON.parse(process.env.BOT_RUN_INPUTS || '{}')
          const screenshotIds = [
            'schedules',
            'schedules-regular',
            'schedules-anarchy',
            'schedules-x',
            'challenges',
            'salmon-run',
            'gear-dailydrop',
            'gear-regular',
            'gear-salmon-run',
            'splatfest-na',
            'splatfest-eu',
            'splatfest-jp',
            'splatfest-ap',
          ]
          const requested = screenshotIds.filter(
            (screenshotId) => inputs[screenshotId.replaceAll('-', '_')] === true
          )
          const now = new Date().toISOString()
          const report = {
            version: 1,
            runId: crypto
              .createHash('sha256')
              .update(`${process.env.GITHUB_RUN_ID || 'local'}:${process.env.GITHUB_RUN_ATTEMPT || '1'}:${requested.join(',')}`)
              .digest('hex'),
            status: 'failed',
            startedAt: now,
            updatedAt: now,
            selection: {
              requested: requested.length > 0 ? requested : ['(missing Screenshot IDs)'],
              effective: [],
              skipped: [],
            },
            screenshots: [],
            diagnostics: [{
              phase: 'prepare',
              severity: 'error',
              summary: 'Bot Run did not reach or complete Data Snapshot preparation.',
              action: 'Inspect the first failed setup or preparation step, correct it, and rerun the Bot Run.',
            }],
          }
          const filename = path.join(process.env.RUNNER_TEMP, 'splatoon3-bot-bootstrap-report.json')
          await fs.writeFile(filename, `${JSON.stringify(report, null, 2)}\n`, { mode: 0o600 })
          NODE

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Chrome for Testing cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Restore Last-known-good Data Snapshot
        if: ${{ env.ACT != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bot-cache/last-known-good-data
          key: splatoon-data-snapshot-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            splatoon-data-snapshot-v1-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Stage fixture Data Snapshot for local Actions verification
        if: ${{ env.ACT == 'true' }}
        run: |
          rm -rf data
          cp -R tests/fixtures/data data
          if [ -n "${ACT_FIXTURE_RENDER_TIME:-}" ]; then
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises'

          const filename = 'data/.snapshot.json'
          const renderTime = new Date(process.env.ACT_FIXTURE_RENDER_TIME)
          if (!Number.isFinite(renderTime.getTime())) {
            throw new Error(`Invalid ACT_FIXTURE_RENDER_TIME: ${process.env.ACT_FIXTURE_RENDER_TIME}`)
          }
          const manifest = JSON.parse(await fs.readFile(filename, 'utf8'))
          manifest.createdAt = renderTime.toISOString()
          await fs.writeFile(filename, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
          fi

      - name: Prepare Data Snapshot and screenshot artifacts
        id: prepare
        env:
          RUN_SCHEDULES: ${{ inputs.schedules }}
          RUN_SCHEDULES_REGULAR: ${{ inputs.schedules_regular }}
          RUN_SCHEDULES_ANARCHY: ${{ inputs.schedules_anarchy }}
          RUN_SCHEDULES_X: ${{ inputs.schedules_x }}
          RUN_CHALLENGES: ${{ inputs.challenges }}
          RUN_SALMON_RUN: ${{ inputs.salmon_run }}
          RUN_GEAR_DAILYDROP: ${{ inputs.gear_dailydrop }}
          RUN_GEAR_REGULAR: ${{ inputs.gear_regular }}
          RUN_GEAR_SALMON_RUN: ${{ inputs.gear_salmon_run }}
          RUN_SPLATFEST_NA: ${{ inputs.splatfest_na }}
          RUN_SPLATFEST_EU: ${{ inputs.splatfest_eu }}
          RUN_SPLATFEST_JP: ${{ inputs.splatfest_jp }}
          RUN_SPLATFEST_AP: ${{ inputs.splatfest_ap }}
          BOT_USE_EXISTING_DATA_SNAPSHOT: ${{ env.ACT == 'true' && 'true' || '' }}
          BOT_LAST_KNOWN_GOOD_DATA_DIRECTORY: .bot-cache/last-known-good-data
          SPLATOON_PUBLIC_DIRECTORY: ${{ env.ACT == 'true' && 'tests/fixtures/public' || '' }}
        run: node bot/run/prepare.mjs

      - name: Save Last-known-good Data Snapshot
        id: save_snapshot_cache
        if: ${{ always() && env.ACT != 'true' && steps.prepare.outputs.snapshot_acquisition == 'fresh' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bot-cache/last-known-good-data
          key: splatoon-data-snapshot-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record Last-known-good cache warning
        if: ${{ always() && steps.save_snapshot_cache.outcome == 'failure' && steps.prepare.outcome == 'success' }}
        env:
          BOT_RUN_WARNING_PHASE: prepare
          BOT_RUN_WARNING_SUMMARY: Fresh Data Snapshot is valid, but GitHub Actions could not save the Last-known-good cache.
          BOT_RUN_WARNING_ACTION: Inspect the Actions cache service and permissions; this run can continue with the validated fresh Data Snapshot.
        run: node bot/run/warn.mjs

      - name: Ensure Bot Run Report exists
        if: ${{ always() }}
        run: |
          mkdir -p screenshots
          if [ ! -s screenshots/run-report.json ]; then
            cp "$RUNNER_TEMP/splatoon3-bot-bootstrap-report.json" screenshots/run-report.json
          fi

      - name: Stage Bot Run for local Actions verification
        if: ${{ env.ACT == 'true' && steps.prepare.outputs.has_content == 'true' }}
        run: |
          test -n "$ACT_BOT_RUN_DIRECTORY"
          mkdir -p "$ACT_BOT_RUN_DIRECTORY"
          archive="$ACT_BOT_RUN_DIRECTORY/bot-run.tar"
          temporary_archive="$archive.tmp"
          rm -f "$temporary_archive"
          {
            find screenshots -maxdepth 1 -type f \( -name '*.png' -o -name 'run-manifest.json' -o -name 'run-report.json' \) -print0
            find data -type f -name '*.json' -print0
          } | sort -z | tar --null --files-from=- --create --file="$temporary_archive"
          mv "$temporary_archive" "$archive"

      - name: Archive Bot Run
        if: ${{ always() && env.ACT != 'true' && steps.prepare.outcome == 'success' && steps.prepare.outputs.has_content == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ steps.prepare.outputs.artifact_name }}-${{ github.run_id }}
          path: |
            screenshots/*.png
            screenshots/run-manifest.json
            screenshots/run-report.json
            data/**/*.json
            data/.snapshot.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ vars.BOT_ARTIFACT_RETENTION_DAYS || '7' }}

      - name: Archive preparation-only Bot Run Report
        if: ${{ always() && env.ACT != 'true' && (steps.prepare.outcome != 'success' || steps.prepare.outputs.has_content != 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-report-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: screenshots/run-report.json
          if-no-files-found: error
          retention-days: ${{ vars.BOT_ARTIFACT_RETENTION_DAYS || '7' }}

      - name: Summarize preparation-only Bot Run
        if: ${{ always() && (steps.prepare.outcome != 'success' || steps.prepare.outputs.has_content != 'true') }}
        run: |
          if [ -f bot/run/report.mjs ] && node bot/run/report.mjs; then
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises'

          const report = JSON.parse(await fs.readFile('screenshots/run-report.json', 'utf8'))
          const lines = [
            '## Bot Run Report',
            '',
            `**Status:** ${report.status}`,
            '',
            '### Diagnostics',
            '',
            ...report.diagnostics.map(
              ({ phase, severity, summary, action }) =>
                `- **${phase}/${severity}:** ${summary}${action ? ` Next: ${action}` : ''}`
            ),
            '',
          ]
          const summary = lines.join('\n')
          process.stdout.write(summary)
          if (process.env.GITHUB_STEP_SUMMARY) {
            await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, summary)
          }
          NODE

  publish:
    name: Publish and notify
    needs: prepare
    if: ${{ needs.prepare.outputs.has_content == 'true' }}
    runs-on: ${{ vars.BOT_RUNNER || 'ubuntu-24.04' }}
    environment: production
    timeout-minutes: 20
    steps:
      - name: Initialize publish failure report
        env:
          RUN_SELECTION: ${{ needs.prepare.outputs.selection }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto'
          import fs from 'node:fs/promises'
          import path from 'node:path'

          const selection = String(process.env.RUN_SELECTION || '')
            .split(',')
            .map((value) => value.trim())
            .filter(Boolean)
          const now = new Date().toISOString()
          const report = {
            version: 1,
            runId: crypto
              .createHash('sha256')
              .update(`${process.env.GITHUB_RUN_ID || 'local'}:${process.env.GITHUB_RUN_ATTEMPT || '1'}:publish:${selection.join(',')}`)
              .digest('hex'),
            status: 'failed',
            startedAt: now,
            updatedAt: now,
            selection: {
              requested: selection.length > 0 ? selection : ['(missing Screenshot IDs)'],
              effective: selection,
              skipped: [],
            },
            screenshots: [],
            diagnostics: [{
              phase: 'publish',
              severity: 'error',
              summary: 'Publish job did not restore or complete the prepared Bot Run.',
              action: 'Inspect the first failed publish setup step, correct it, and rerun the failed job.',
            }],
          }
          const filename = path.join(process.env.RUNNER_TEMP, 'splatoon3-bot-publish-bootstrap-report.json')
          await fs.writeFile(filename, `${JSON.stringify(report, null, 2)}\n`, { mode: 0o600 })
          NODE

      - name: Download Bot Run to recovery storage
        if: ${{ env.ACT != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots-${{ needs.prepare.outputs.artifact_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/splatoon3-bot-run

      - name: Prepare publish recovery report
        if: ${{ always() }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises'
          import path from 'node:path'

          const bootstrapFilename = path.join(
            process.env.RUNNER_TEMP,
            'splatoon3-bot-publish-bootstrap-report.json'
          )
          const preparedFilename = path.join(
            process.env.RUNNER_TEMP,
            'splatoon3-bot-run',
            'screenshots',
            'run-report.json'
          )
          const recoveryFilename = path.join(
            process.env.RUNNER_TEMP,
            'splatoon3-bot-publish-recovery-report.json'
          )
          const bootstrap = JSON.parse(await fs.readFile(bootstrapFilename, 'utf8'))
          let recovery = bootstrap
          try {
            const prepared = JSON.parse(await fs.readFile(preparedFilename, 'utf8'))
            recovery = {
              ...prepared,
              status: 'failed',
              updatedAt: new Date().toISOString(),
              diagnostics: [
                ...(Array.isArray(prepared.diagnostics) ? prepared.diagnostics : []),
                ...bootstrap.diagnostics,
              ],
            }
          } catch (error) {
            if (error?.code !== 'ENOENT') {
              recovery = {
                ...bootstrap,
                diagnostics: [
                  ...bootstrap.diagnostics,
                  {
                    phase: 'publish',
                    severity: 'error',
                    summary: 'The prepared Bot Run Report could not be recovered.',
                    action: 'Inspect the downloaded Bot Run artifact before rerunning the failed job.',
                  },
                ],
              }
            }
          }
          await fs.writeFile(recoveryFilename, `${JSON.stringify(recovery, null, 2)}\n`, { mode: 0o600 })
          NODE

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod --strict-peer-dependencies

      - name: Restore Delivery Ledger
        if: ${{ env.ACT != 'true' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bot-cache/delivery-ledger
          key: splatoon-delivery-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            splatoon-delivery-ledger-v1-

      - name: Prepare Delivery Ledger directory
        run: mkdir -p .bot-cache/delivery-ledger

      - name: Restore downloaded Bot Run
        if: ${{ env.ACT != 'true' }}
        run: cp -R "$RUNNER_TEMP/splatoon3-bot-run/." .

      - name: Restore Bot Run for local Actions verification
        if: ${{ env.ACT == 'true' }}
        run: |
          test -n "$ACT_BOT_RUN_DIRECTORY"
          archive="$ACT_BOT_RUN_DIRECTORY/bot-run.tar"
          test -s "$archive"
          tar --extract --file="$archive" --directory=.

      - name: Ensure publish Bot Run Report exists
        if: ${{ always() }}
        run: |
          mkdir -p screenshots
          if [ ! -s screenshots/run-report.json ]; then
            cp "$RUNNER_TEMP/splatoon3-bot-publish-recovery-report.json" screenshots/run-report.json
          fi

      - name: Validate Bot configuration
        env:
          RUN_SELECTION: ${{ needs.prepare.outputs.selection }}
          CHANNEL: ${{ inputs.notification_channel }}
          BOT_TIME_ZONE: ${{ vars.BOT_TIME_ZONE || 'Asia/Shanghai' }}
          BOT_LOCALE: ${{ vars.BOT_LOCALE || 'zh-CN' }}
          BOT_SCREENSHOT_RESOLUTION: ${{ vars.BOT_SCREENSHOT_RESOLUTION || '1200x675' }}
          BOT_SCREENSHOT_ATTRIBUTION: ${{ vars.BOT_SCREENSHOT_ATTRIBUTION || 'splatoon3.ink' }}
          S3_CONFIG: ${{ secrets.S3_CONFIG }}
          BOT_WECOM_CONFIG: ${{ secrets.BOT_WECOM_CONFIG }}
          BOT_DISCORD_CONFIG: ${{ secrets.BOT_DISCORD_CONFIG }}
          BOT_TELEGRAM_CONFIG: ${{ secrets.BOT_TELEGRAM_CONFIG }}
          BOT_QQ_CONFIG: ${{ secrets.BOT_QQ_CONFIG }}
          BOT_FEISHU_CONFIG: ${{ secrets.BOT_FEISHU_CONFIG }}
          BOT_DINGTALK_CONFIG: ${{ secrets.BOT_DINGTALK_CONFIG }}
          BOT_WHATSAPP_CONFIG: ${{ secrets.BOT_WHATSAPP_CONFIG }}
          BOT_LINE_CONFIG: ${{ secrets.BOT_LINE_CONFIG }}
          BOT_SLACK_CONFIG: ${{ secrets.BOT_SLACK_CONFIG }}
        run: node bot/config/index.mjs "$RUN_SELECTION" "$CHANNEL"

      - name: Publish through S3
        env:
          RUN_SELECTION: ${{ needs.prepare.outputs.selection }}
          S3_CONFIG: ${{ secrets.S3_CONFIG }}
        run: node bot/publish/index.mjs "$RUN_SELECTION"

      - name: Deliver configured notifications
        id: deliver_notifications
        env:
          RUN_SELECTION: ${{ needs.prepare.outputs.selection }}
          CHANNEL: ${{ inputs.notification_channel }}
          BOT_DELIVERY_LEDGER_DIRECTORY: .bot-cache/delivery-ledger
          BOT_WECOM_CONFIG: ${{ secrets.BOT_WECOM_CONFIG }}
          BOT_DISCORD_CONFIG: ${{ secrets.BOT_DISCORD_CONFIG }}
          BOT_TELEGRAM_CONFIG: ${{ secrets.BOT_TELEGRAM_CONFIG }}
          BOT_QQ_CONFIG: ${{ secrets.BOT_QQ_CONFIG }}
          BOT_FEISHU_CONFIG: ${{ secrets.BOT_FEISHU_CONFIG }}
          BOT_DINGTALK_CONFIG: ${{ secrets.BOT_DINGTALK_CONFIG }}
          BOT_WHATSAPP_CONFIG: ${{ secrets.BOT_WHATSAPP_CONFIG }}
          BOT_LINE_CONFIG: ${{ secrets.BOT_LINE_CONFIG }}
          BOT_SLACK_CONFIG: ${{ secrets.BOT_SLACK_CONFIG }}
        run: node bot/notification/index.mjs "$RUN_SELECTION" "$CHANNEL"

      - name: Save Delivery Ledger
        id: save_delivery_ledger
        if: ${{ always() && env.ACT != 'true' && (steps.deliver_notifications.outcome == 'success' || steps.deliver_notifications.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bot-cache/delivery-ledger
          key: splatoon-delivery-ledger-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record Delivery Ledger cache warning
        if: ${{ always() && steps.save_delivery_ledger.outcome == 'failure' }}
        env:
          BOT_RUN_WARNING_PHASE: notify
          BOT_RUN_WARNING_SUMMARY: Notification delivery finished, but GitHub Actions could not save the private Delivery Ledger cache.
          BOT_RUN_WARNING_ACTION: Inspect the Actions cache service before rerunning; verify destination history because successful Delivery IDs may not be available to the rerun.
        run: node bot/run/warn.mjs

      - name: Summarize Bot Run
        if: ${{ always() }}
        run: |
          if [ -f bot/run/report.mjs ] && node bot/run/report.mjs; then
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises'

          const report = JSON.parse(await fs.readFile('screenshots/run-report.json', 'utf8'))
          const lines = [
            '## Bot Run Report',
            '',
            `**Status:** ${report.status}`,
            '',
            '### Diagnostics',
            '',
            ...report.diagnostics.map(
              ({ phase, severity, summary, action }) =>
                `- **${phase}/${severity}:** ${summary}${action ? ` Next: ${action}` : ''}`
            ),
            '',
          ]
          const summary = lines.join('\n')
          process.stdout.write(summary)
          if (process.env.GITHUB_STEP_SUMMARY) {
            await fs.appendFile(process.env.GITHUB_STEP_SUMMARY, summary)
          }
          NODE

      - name: Archive Bot Run Report
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-report-${{ needs.prepare.outputs.artifact_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: screenshots/run-report.json
          if-no-files-found: error
          retention-days: ${{ vars.BOT_ARTIFACT_RETENTION_DAYS || '7' }}
