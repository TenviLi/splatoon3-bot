name: Splatoon3 Bot (reusable)

on:
  workflow_call:
    inputs:
      profile:
        description: Run Profile to execute
        required: true
        type: string
      notification_channel:
        description: Optional single Notification Channel for smoke testing
        required: false
        default: ''
        type: string
    secrets:
      S3_CONFIG:
        required: true
      BOT_WECOM_CONFIG:
        required: false
      BOT_DISCORD_CONFIG:
        required: false
      BOT_TELEGRAM_CONFIG:
        required: false
      BOT_QQ_CONFIG:
        required: false
      BOT_FEISHU_CONFIG:
        required: false
      BOT_DINGTALK_CONFIG:
        required: false
      BOT_WHATSAPP_CONFIG:
        required: false
      BOT_LINE_CONFIG:
        required: false
      BOT_SLACK_CONFIG:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ vars.BOT_CONCURRENCY_GROUP || 'splatoon3-bot-production' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.profile }}
    runs-on: ${{ vars.BOT_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    outputs:
      artifact_name: ${{ steps.plan.outputs.artifact_name }}
      profile: ${{ steps.plan.outputs.profile }}
    env:
      BOT_TIME_ZONE: ${{ vars.BOT_TIME_ZONE || 'Asia/Shanghai' }}
      BOT_SCREENSHOT_ATTRIBUTION: ${{ vars.BOT_SCREENSHOT_ATTRIBUTION || 'splatoon3.ink' }}
      TZ: ${{ vars.BOT_TIME_ZONE || 'Asia/Shanghai' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Chrome for Testing cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: chrome-for-testing-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Resolve Run Plan
        id: plan
        env:
          PROFILE: ${{ inputs.profile }}
        run: node bot/run/describe.mjs "$PROFILE"

      - name: Stage fixture Data Snapshot for local Actions verification
        if: ${{ env.ACT == 'true' }}
        run: |
          rm -rf data
          cp -R tests/fixtures/data data

      - name: Prepare Data Snapshot and screenshot artifacts
        env:
          PROFILE: ${{ steps.plan.outputs.profile }}
          BOT_USE_EXISTING_DATA_SNAPSHOT: ${{ env.ACT == 'true' && 'true' || '' }}
          SPLATOON_PUBLIC_DIRECTORY: ${{ env.ACT == 'true' && 'tests/fixtures/public' || '' }}
        run: node bot/run/prepare.mjs "$PROFILE"

      - name: Stage Bot Run for local Actions verification
        if: ${{ env.ACT == 'true' }}
        run: |
          test -n "$ACT_BOT_RUN_DIRECTORY"
          mkdir -p "$ACT_BOT_RUN_DIRECTORY"
          archive="$ACT_BOT_RUN_DIRECTORY/bot-run.tar"
          temporary_archive="$archive.tmp"
          rm -f "$temporary_archive"
          {
            find screenshots -maxdepth 1 -type f \( -name '*.png' -o -name 'run-manifest.json' \) -print0
            find data -type f -name '*.json' -print0
          } | sort -z | tar --null --files-from=- --create --file="$temporary_archive"
          mv "$temporary_archive" "$archive"

      - name: Archive Bot Run
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots-${{ steps.plan.outputs.artifact_name }}-${{ github.run_id }}
          path: |
            screenshots/*.png
            screenshots/run-manifest.json
            data/**/*.json
            data/.snapshot.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: ${{ vars.BOT_ARTIFACT_RETENTION_DAYS || '7' }}

  publish:
    name: Publish and notify
    needs: prepare
    runs-on: ${{ vars.BOT_RUNNER || 'ubuntu-24.04' }}
    environment: ${{ vars.BOT_ENVIRONMENT || 'production' }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod --strict-peer-dependencies

      - name: Validate Bot configuration
        env:
          PROFILE: ${{ needs.prepare.outputs.profile }}
          CHANNEL: ${{ inputs.notification_channel }}
          BOT_TIME_ZONE: ${{ vars.BOT_TIME_ZONE || 'Asia/Shanghai' }}
          BOT_SCREENSHOT_ATTRIBUTION: ${{ vars.BOT_SCREENSHOT_ATTRIBUTION || 'splatoon3.ink' }}
          BOT_BRANDING_CONFIG: ${{ vars.BOT_BRANDING_CONFIG }}
          S3_CONFIG: ${{ secrets.S3_CONFIG }}
          BOT_WECOM_CONFIG: ${{ secrets.BOT_WECOM_CONFIG }}
          BOT_DISCORD_CONFIG: ${{ secrets.BOT_DISCORD_CONFIG }}
          BOT_TELEGRAM_CONFIG: ${{ secrets.BOT_TELEGRAM_CONFIG }}
          BOT_QQ_CONFIG: ${{ secrets.BOT_QQ_CONFIG }}
          BOT_FEISHU_CONFIG: ${{ secrets.BOT_FEISHU_CONFIG }}
          BOT_DINGTALK_CONFIG: ${{ secrets.BOT_DINGTALK_CONFIG }}
          BOT_WHATSAPP_CONFIG: ${{ secrets.BOT_WHATSAPP_CONFIG }}
          BOT_LINE_CONFIG: ${{ secrets.BOT_LINE_CONFIG }}
          BOT_SLACK_CONFIG: ${{ secrets.BOT_SLACK_CONFIG }}
        run: node bot/config/index.mjs "$PROFILE" "$CHANNEL"

      - name: Download Bot Run
        if: ${{ env.ACT != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots-${{ needs.prepare.outputs.artifact_name }}-${{ github.run_id }}
          path: .

      - name: Restore Bot Run for local Actions verification
        if: ${{ env.ACT == 'true' }}
        run: |
          test -n "$ACT_BOT_RUN_DIRECTORY"
          archive="$ACT_BOT_RUN_DIRECTORY/bot-run.tar"
          test -s "$archive"
          tar --extract --file="$archive" --directory=.

      - name: Publish through S3
        env:
          PROFILE: ${{ needs.prepare.outputs.profile }}
          S3_CONFIG: ${{ secrets.S3_CONFIG }}
          BOT_BRANDING_CONFIG: ${{ vars.BOT_BRANDING_CONFIG }}
        run: node bot/publish/index.mjs "$PROFILE"

      - name: Deliver configured notifications
        env:
          PROFILE: ${{ needs.prepare.outputs.profile }}
          CHANNEL: ${{ inputs.notification_channel }}
          BOT_WECOM_CONFIG: ${{ secrets.BOT_WECOM_CONFIG }}
          BOT_DISCORD_CONFIG: ${{ secrets.BOT_DISCORD_CONFIG }}
          BOT_TELEGRAM_CONFIG: ${{ secrets.BOT_TELEGRAM_CONFIG }}
          BOT_QQ_CONFIG: ${{ secrets.BOT_QQ_CONFIG }}
          BOT_FEISHU_CONFIG: ${{ secrets.BOT_FEISHU_CONFIG }}
          BOT_DINGTALK_CONFIG: ${{ secrets.BOT_DINGTALK_CONFIG }}
          BOT_WHATSAPP_CONFIG: ${{ secrets.BOT_WHATSAPP_CONFIG }}
          BOT_LINE_CONFIG: ${{ secrets.BOT_LINE_CONFIG }}
          BOT_SLACK_CONFIG: ${{ secrets.BOT_SLACK_CONFIG }}
        run: node bot/notification/index.mjs "$PROFILE" "$CHANNEL"
