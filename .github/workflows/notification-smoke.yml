name: Notification Channel smoke test

on:
  workflow_dispatch:
    inputs:
      schedules:
        description: Include battle overview (Regular/Anarchy/X or Splatfest)
        type: boolean
        default: true
      schedules_regular:
        description: Include the single Regular Battle card
        type: boolean
        default: false
      schedules_anarchy:
        description: Include the Anarchy Series and Open cards
        type: boolean
        default: false
      schedules_x:
        description: Include the single X Battle card
        type: boolean
        default: false
      challenges:
        description: Include Challenges
        type: boolean
        default: false
      salmon_run:
        description: Include Salmon Run
        type: boolean
        default: false
      gear:
        description: Include Gear (Daily Drop + Regular + Salmon Run)
        type: boolean
        default: false
      splatfest:
        description: Include Splatfest views and notifications for all regions
        type: boolean
        default: false
      channel:
        description: Notification Channel to test
        default: wecom
        required: true
        type: choice
        options:
          - wecom
          - discord
          - telegram
          - qq
          - feishu
          - dingtalk
          - whatsapp
          - line
          - slack

permissions:
  contents: read

jobs:
  smoke:
    uses: ./.github/workflows/bot-reusable.yml
    with:
      schedules: ${{ inputs.schedules }}
      schedules_regular: ${{ inputs.schedules_regular }}
      schedules_anarchy: ${{ inputs.schedules_anarchy }}
      schedules_x: ${{ inputs.schedules_x }}
      challenges: ${{ inputs.challenges }}
      salmon_run: ${{ inputs.salmon_run }}
      gear: ${{ inputs.gear }}
      splatfest: ${{ inputs.splatfest }}
      notification_channel: ${{ inputs.channel }}
    secrets:
      S3_CONFIG: ${{ secrets.S3_CONFIG }}
      BOT_WECOM_CONFIG: ${{ secrets.BOT_WECOM_CONFIG }}
      BOT_DISCORD_CONFIG: ${{ secrets.BOT_DISCORD_CONFIG }}
      BOT_TELEGRAM_CONFIG: ${{ secrets.BOT_TELEGRAM_CONFIG }}
      BOT_QQ_CONFIG: ${{ secrets.BOT_QQ_CONFIG }}
      BOT_FEISHU_CONFIG: ${{ secrets.BOT_FEISHU_CONFIG }}
      BOT_DINGTALK_CONFIG: ${{ secrets.BOT_DINGTALK_CONFIG }}
      BOT_WHATSAPP_CONFIG: ${{ secrets.BOT_WHATSAPP_CONFIG }}
      BOT_LINE_CONFIG: ${{ secrets.BOT_LINE_CONFIG }}
      BOT_SLACK_CONFIG: ${{ secrets.BOT_SLACK_CONFIG }}
