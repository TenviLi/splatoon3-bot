name: Notification Channel smoke test

on:
  workflow_dispatch:
    inputs:
      screenshot_id:
        description: Screenshot ID to publish and send
        default: schedules
        required: true
        type: choice
        options:
          - schedules
          - schedules-regular
          - schedules-anarchy
          - schedules-x
          - challenges
          - salmon-run
          - gear-dailydrop
          - gear-regular
          - gear-salmon-run
          - splatfest-na
          - splatfest-eu
          - splatfest-jp
          - splatfest-ap
      channel:
        description: Notification Channel to test
        default: wecom
        required: true
        type: choice
        options:
          - wecom
          - discord
          - telegram
          - qq
          - feishu
          - dingtalk
          - whatsapp
          - line
          - slack

permissions:
  contents: read

jobs:
  smoke:
    uses: ./.github/workflows/bot-reusable.yml
    with:
      schedules: ${{ inputs.screenshot_id == 'schedules' }}
      schedules_regular: ${{ inputs.screenshot_id == 'schedules-regular' }}
      schedules_anarchy: ${{ inputs.screenshot_id == 'schedules-anarchy' }}
      schedules_x: ${{ inputs.screenshot_id == 'schedules-x' }}
      challenges: ${{ inputs.screenshot_id == 'challenges' }}
      salmon_run: ${{ inputs.screenshot_id == 'salmon-run' }}
      gear_dailydrop: ${{ inputs.screenshot_id == 'gear-dailydrop' }}
      gear_regular: ${{ inputs.screenshot_id == 'gear-regular' }}
      gear_salmon_run: ${{ inputs.screenshot_id == 'gear-salmon-run' }}
      splatfest_na: ${{ inputs.screenshot_id == 'splatfest-na' }}
      splatfest_eu: ${{ inputs.screenshot_id == 'splatfest-eu' }}
      splatfest_jp: ${{ inputs.screenshot_id == 'splatfest-jp' }}
      splatfest_ap: ${{ inputs.screenshot_id == 'splatfest-ap' }}
      notification_channel: ${{ inputs.channel }}
    secrets:
      S3_CONFIG: ${{ secrets.S3_CONFIG }}
      BOT_WECOM_CONFIG: ${{ secrets.BOT_WECOM_CONFIG }}
      BOT_DISCORD_CONFIG: ${{ secrets.BOT_DISCORD_CONFIG }}
      BOT_TELEGRAM_CONFIG: ${{ secrets.BOT_TELEGRAM_CONFIG }}
      BOT_QQ_CONFIG: ${{ secrets.BOT_QQ_CONFIG }}
      BOT_FEISHU_CONFIG: ${{ secrets.BOT_FEISHU_CONFIG }}
      BOT_DINGTALK_CONFIG: ${{ secrets.BOT_DINGTALK_CONFIG }}
      BOT_WHATSAPP_CONFIG: ${{ secrets.BOT_WHATSAPP_CONFIG }}
      BOT_LINE_CONFIG: ${{ secrets.BOT_LINE_CONFIG }}
      BOT_SLACK_CONFIG: ${{ secrets.BOT_SLACK_CONFIG }}
