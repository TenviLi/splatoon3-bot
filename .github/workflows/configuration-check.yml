name: Check Bot Configuration

on:
  workflow_dispatch:
    inputs:
      schedules:
        description: 'Content Group schedules: battle overview (Regular/Anarchy/X or Splatfest)'
        type: boolean
        default: true
      schedules_regular:
        description: 'Content Group schedules-regular: single Regular Battle card'
        type: boolean
        default: true
      schedules_anarchy:
        description: 'Content Group schedules-anarchy: Anarchy Series and Open cards'
        type: boolean
        default: true
      schedules_x:
        description: 'Content Group schedules-x: single X Battle card'
        type: boolean
        default: true
      challenges:
        description: 'Content Group challenges: Challenges'
        type: boolean
        default: true
      salmon_run:
        description: 'Content Group salmon-run: Salmon Run'
        type: boolean
        default: true
      gear:
        description: 'Content Group gear: Daily Drop, regular shop, and Salmon Run gear'
        type: boolean
        default: true
      splatfest:
        description: 'Content Group splatfest: Splatfest views and notifications for all regions'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: configuration-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check selected configuration
    runs-on: ${{ vars.BOT_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Require at least one Content Group
        if: ${{ !inputs.schedules && !inputs.schedules_regular && !inputs.schedules_anarchy && !inputs.schedules_x && !inputs.challenges && !inputs.salmon_run && !inputs.gear && !inputs.splatfest }}
        run: |
          echo "Select at least one Content Group" >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod --strict-peer-dependencies

      - name: Resolve Run Plan
        id: plan
        env:
          RUN_SCHEDULES: ${{ inputs.schedules }}
          RUN_SCHEDULES_REGULAR: ${{ inputs.schedules_regular }}
          RUN_SCHEDULES_ANARCHY: ${{ inputs.schedules_anarchy }}
          RUN_SCHEDULES_X: ${{ inputs.schedules_x }}
          RUN_CHALLENGES: ${{ inputs.challenges }}
          RUN_SALMON_RUN: ${{ inputs.salmon_run }}
          RUN_GEAR: ${{ inputs.gear }}
          RUN_SPLATFEST: ${{ inputs.splatfest }}
        run: node bot/run/describe.mjs

      - name: Check Bot configuration without side effects
        env:
          RUN_SELECTION: ${{ steps.plan.outputs.selection }}
          BOT_TIME_ZONE: ${{ vars.BOT_TIME_ZONE || 'Asia/Shanghai' }}
          BOT_LOCALE: ${{ vars.BOT_LOCALE || 'zh-CN' }}
          BOT_SCREENSHOT_RESOLUTION: ${{ vars.BOT_SCREENSHOT_RESOLUTION || '1200x675' }}
          BOT_SCREENSHOT_ATTRIBUTION: ${{ vars.BOT_SCREENSHOT_ATTRIBUTION || 'splatoon3.ink' }}
          S3_CONFIG: ${{ secrets.S3_CONFIG }}
          BOT_WECOM_CONFIG: ${{ secrets.BOT_WECOM_CONFIG }}
          BOT_DISCORD_CONFIG: ${{ secrets.BOT_DISCORD_CONFIG }}
          BOT_TELEGRAM_CONFIG: ${{ secrets.BOT_TELEGRAM_CONFIG }}
          BOT_QQ_CONFIG: ${{ secrets.BOT_QQ_CONFIG }}
          BOT_FEISHU_CONFIG: ${{ secrets.BOT_FEISHU_CONFIG }}
          BOT_DINGTALK_CONFIG: ${{ secrets.BOT_DINGTALK_CONFIG }}
          BOT_WHATSAPP_CONFIG: ${{ secrets.BOT_WHATSAPP_CONFIG }}
          BOT_LINE_CONFIG: ${{ secrets.BOT_LINE_CONFIG }}
          BOT_SLACK_CONFIG: ${{ secrets.BOT_SLACK_CONFIG }}
        run: pnpm run bot:doctor "$RUN_SELECTION"
