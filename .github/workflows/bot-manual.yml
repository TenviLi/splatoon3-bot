name: Splatoon3 Bot (manual)

on:
  workflow_dispatch:
    inputs:
      schedules:
        description: 'Content Group schedules: battle overview (Regular/Anarchy/X or Splatfest)'
        type: boolean
        default: true
      schedules_regular:
        description: 'Content Group schedules-regular: single Regular Battle card'
        type: boolean
        default: false
      schedules_anarchy:
        description: 'Content Group schedules-anarchy: Anarchy Series and Open cards'
        type: boolean
        default: false
      schedules_x:
        description: 'Content Group schedules-x: single X Battle card'
        type: boolean
        default: false
      challenges:
        description: 'Content Group challenges: Challenges'
        type: boolean
        default: false
      salmon_run:
        description: 'Content Group salmon-run: Salmon Run'
        type: boolean
        default: false
      gear:
        description: 'Content Group gear: Daily Drop, regular shop, and Salmon Run gear'
        type: boolean
        default: false
      splatfest:
        description: 'Content Group splatfest: Splatfest views and notifications for all regions'
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  bot:
    uses: ./.github/workflows/bot-reusable.yml
    with:
      schedules: ${{ inputs.schedules }}
      schedules_regular: ${{ inputs.schedules_regular }}
      schedules_anarchy: ${{ inputs.schedules_anarchy }}
      schedules_x: ${{ inputs.schedules_x }}
      challenges: ${{ inputs.challenges }}
      salmon_run: ${{ inputs.salmon_run }}
      gear: ${{ inputs.gear }}
      splatfest: ${{ inputs.splatfest }}
    secrets:
      S3_CONFIG: ${{ secrets.S3_CONFIG }}
      BOT_WECOM_CONFIG: ${{ secrets.BOT_WECOM_CONFIG }}
      BOT_DISCORD_CONFIG: ${{ secrets.BOT_DISCORD_CONFIG }}
      BOT_TELEGRAM_CONFIG: ${{ secrets.BOT_TELEGRAM_CONFIG }}
      BOT_QQ_CONFIG: ${{ secrets.BOT_QQ_CONFIG }}
      BOT_FEISHU_CONFIG: ${{ secrets.BOT_FEISHU_CONFIG }}
      BOT_DINGTALK_CONFIG: ${{ secrets.BOT_DINGTALK_CONFIG }}
      BOT_WHATSAPP_CONFIG: ${{ secrets.BOT_WHATSAPP_CONFIG }}
      BOT_LINE_CONFIG: ${{ secrets.BOT_LINE_CONFIG }}
      BOT_SLACK_CONFIG: ${{ secrets.BOT_SLACK_CONFIG }}
