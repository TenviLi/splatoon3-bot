name: Splatoon3 Bot (manual)

on:
  workflow_dispatch:
    inputs:
      schedules:
        description: 'Screenshot ID schedules: battle overview (Regular/Anarchy/X or Splatfest)'
        type: boolean
        default: true
      schedules_regular:
        description: 'Screenshot ID schedules-regular: single Regular Battle card'
        type: boolean
        default: false
      schedules_anarchy:
        description: 'Screenshot ID schedules-anarchy: Anarchy Series and Open cards'
        type: boolean
        default: false
      schedules_x:
        description: 'Screenshot ID schedules-x: single X Battle card'
        type: boolean
        default: false
      challenges:
        description: 'Screenshot ID challenges: Challenges'
        type: boolean
        default: false
      salmon_run:
        description: 'Screenshot ID salmon-run: Salmon Run'
        type: boolean
        default: false
      gear_dailydrop:
        description: 'Screenshot ID gear-dailydrop: Daily Drop gear'
        type: boolean
        default: false
      gear_regular:
        description: 'Screenshot ID gear-regular: gear currently on sale'
        type: boolean
        default: false
      gear_salmon_run:
        description: 'Screenshot ID gear-salmon-run: monthly Salmon Run gear'
        type: boolean
        default: false
      splatfest_na:
        description: 'Screenshot ID splatfest-na: North America Splatfest'
        type: boolean
        default: false
      splatfest_eu:
        description: 'Screenshot ID splatfest-eu: Europe Splatfest'
        type: boolean
        default: false
      splatfest_jp:
        description: 'Screenshot ID splatfest-jp: Japan Splatfest'
        type: boolean
        default: false
      splatfest_ap:
        description: 'Screenshot ID splatfest-ap: Asia-Pacific Splatfest'
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  bot:
    uses: ./.github/workflows/bot-reusable.yml
    with:
      schedules: ${{ inputs.schedules }}
      schedules_regular: ${{ inputs.schedules_regular }}
      schedules_anarchy: ${{ inputs.schedules_anarchy }}
      schedules_x: ${{ inputs.schedules_x }}
      challenges: ${{ inputs.challenges }}
      salmon_run: ${{ inputs.salmon_run }}
      gear_dailydrop: ${{ inputs.gear_dailydrop }}
      gear_regular: ${{ inputs.gear_regular }}
      gear_salmon_run: ${{ inputs.gear_salmon_run }}
      splatfest_na: ${{ inputs.splatfest_na }}
      splatfest_eu: ${{ inputs.splatfest_eu }}
      splatfest_jp: ${{ inputs.splatfest_jp }}
      splatfest_ap: ${{ inputs.splatfest_ap }}
    secrets:
      S3_CONFIG: ${{ secrets.S3_CONFIG }}
      BOT_WECOM_CONFIG: ${{ secrets.BOT_WECOM_CONFIG }}
      BOT_DISCORD_CONFIG: ${{ secrets.BOT_DISCORD_CONFIG }}
      BOT_TELEGRAM_CONFIG: ${{ secrets.BOT_TELEGRAM_CONFIG }}
      BOT_QQ_CONFIG: ${{ secrets.BOT_QQ_CONFIG }}
      BOT_FEISHU_CONFIG: ${{ secrets.BOT_FEISHU_CONFIG }}
      BOT_DINGTALK_CONFIG: ${{ secrets.BOT_DINGTALK_CONFIG }}
      BOT_WHATSAPP_CONFIG: ${{ secrets.BOT_WHATSAPP_CONFIG }}
      BOT_LINE_CONFIG: ${{ secrets.BOT_LINE_CONFIG }}
      BOT_SLACK_CONFIG: ${{ secrets.BOT_SLACK_CONFIG }}
