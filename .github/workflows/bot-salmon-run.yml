name: Splatooon3 Bot (daily twice)

on:
  schedule:
    - cron: '0 2,10 */1 * *'
env:
  TZ: 'Asia/Shanghai'

jobs:
  bot:
    name: Generate Screenshots
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.set-matrix.outputs.screenshot_names }}
    steps:
      - uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest
          # run_install: |
          #   - args: [--frozen-lockfile, --strict-peer-dependencies]

      - name: Set Node.js version to 18
        uses: actions/setup-node@v2
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install Dependencies
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Download all splatoon3.ink data
        run: pnpm run download-data --experimental-fetch

      - name: Build FrontEnd Pages
        run: pnpm build

      - name: Generate Screenshots
        uses: mujo-code/puppeteer-headful@18.9.0
        env:
          CI: 'true'
          TZ: 'Asia/Shanghai'
        with:
          args: node bot/screenshot/index.mjs salmon-run,gear-dailydrop,gear-regular # run command inside image

      - name: Check Screenshots
        id: set-matrix
        run: |
          export screenshot_names=$(ls ./screenshots/*.png | cut -d '.' -f1  | xargs | sed 's/ /,/g')
          echo "::set-output name=screenshot_names::$screenshot_names"

      - name: Upload Screenshots
        uses: bwcxyk/upyun-upx-action@1.1
        env:
          bucket: ${{ secrets.UPYUN_BUCKET }}
          operator: ${{ secrets.UPYUN_OPERATOR }}
          operator_password: ${{ secrets.UPYUN_SECRET }}
          local_path: ./screenshots/
          remote_path: /

      - name: Trigger Bot Webhook
        env:
          TZ: 'Asia/Shanghai'
          # SCREENSHOT_NAMES: ${{ needs.generate_screenshots.outputs.names }}
          UPYUN_DOMAIN: ${{ secrets.UPYUN_DOMAIN }}
          SPLATOON_SCHEDULES_BOT_URL: ${{ secrets.SPLATOON_SCHEDULES_BOT_URL }}
          SPLATOON_SALMON_RUN_BOT_URL: ${{ secrets.SPLATOON_SALMON_RUN_BOT_URL }}
          SPLATOON_GEAR_BOT_URL: ${{ secrets.SPLATOON_GEAR_BOT_URL }}
        run: node bot/send/index.mjs salmon-run,gear-dailydrop,gear-regular --experimental-fetch

      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 6

      - name: Archive Screenshots
        uses: actions/upload-artifact@v3
        with:
          name: screenshots
          path: screenshots/*.png
          retention-days: 7
