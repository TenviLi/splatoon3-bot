version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /.github/act
    schedule:
      interval: weekly
      day: monday
      time: '09:45'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /.github/gitleaks
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
